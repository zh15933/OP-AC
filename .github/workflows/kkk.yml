name: 自动清理历史记录

on:
  workflow_dispatch: # 支持手动触发
    inputs:
      keep_runs:
        description: '保留最近的多少个 Actions 记录'
        required: true
        default: '5'
      delete_releases:
        description: '是否同时清理 Releases（仅保留最新的 2 个）'
        type: boolean
        required: true
        default: false
  schedule:
    # 设定为每月 1 号和 15 号 UTC 00:00 (北京早 8 点)
    - cron: '0 0 1,15 * *'

jobs:
  delete-runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write   # 允许删除 Actions 记录
      contents: write  # 允许删除 Releases
    steps:
      - name: 清理 Actions 历史记录
        env:
          # 直接使用 GitHub 自动生成的临时 Token，不需要你去配 Secrets
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="${{ github.repository }}"
          KEEP_RUNS="${{ github.event.inputs.keep_runs || 5 }}"
          
          echo "🔍 正在获取仓库 [$repo] 的历史运行记录..."
          
          # 使用 REST API 获取历史记录
          response=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/$repo/actions/runs?per_page=100")
            
          # 过滤出不是 in_progress 和 queued 的记录，并按时间倒序
          runs=$(echo "$response" | jq -r '.workflow_runs | sort_by(.created_at) | reverse | .[] | select(.status != "in_progress" and .status != "queued") | .id')
          
          if [ -z "$runs" ]; then
            echo "✅ 没有发现可清理的历史记录！"
            exit 0
          fi

          count=0
          skip=0
          for run_id in $runs; do
            if [ "$skip" -lt "$KEEP_RUNS" ]; then
              skip=$((skip + 1))
              echo "🛡️ 保留最近的记录 ID: $run_id"
              continue
            fi
            
            echo "🗑️ 正在删除记录 ID: $run_id ..."
            curl -s -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/$repo/actions/runs/$run_id"
            count=$((count + 1))
          done
          
          echo "✨ 清理完成！共删除 $count 条历史记录。"

      - name: 可选清理 Releases
        if: ${{ github.event.inputs.delete_releases == 'true' || github.event_name == 'schedule' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="${{ github.repository }}"
          KEEP_RELEASES=2 # 设定你想保留的最新 Release 数量
          
          echo "🔍 正在检查 Releases 记录..."
          
          # 使用 REST API 获取 Releases
          response=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/$repo/releases?per_page=100")
            
          # 按时间倒序获取 tag 名称
          releases=$(echo "$response" | jq -r 'sort_by(.created_at) | reverse | .[] | .tag_name')
          
          if [ -z "$releases" ]; then
            echo "✅ 没有发现 Releases！"
            exit 0
          fi

          count=0
          skip=0
          for tag in $releases; do
            if [ "$skip" -lt "$KEEP_RELEASES" ]; then
              skip=$((skip + 1))
              echo "🛡️ 保留最新的 Release: $tag"
              continue
            fi
            
            echo "🗑️ 正在删除旧 Release: $tag ..."
            # 使用 API 删除 Release 及其附带的固件
            # 注意：要删除 tag，需要先获取 release_id，然后 DELETE。
            # 这里我们先用 tag 查 release_id
            rel_id=$(echo "$response" | jq -r ".[] | select(.tag_name==\"$tag\") | .id")
            if [ -n "$rel_id" ]; then
              curl -s -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
                "https://api.github.com/repos/$repo/releases/$rel_id"
              count=$((count + 1))
            fi
          done
          
          echo "✨ Release 清理完成！共删除 $count 个旧版本。"