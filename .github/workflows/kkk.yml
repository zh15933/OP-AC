name: 自动清理历史记录

on:
  workflow_dispatch: # 支持手动触发
    inputs:
      keep_runs:
        description: '保留最近的多少个 Actions 记录'
        required: true
        default: '5'
      delete_releases:
        description: '是否同时清理 Releases（仅保留最新的 2 个）'
        type: boolean
        required: true
        default: false
  schedule:
    # 设定为每月 1 号和 15 号 UTC 00:00 (北京早 8 点)
    - cron: '0 0 1,15 * *'

jobs:
  delete-runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write # 如果清理 Release 需要这个权限
    steps:
      - name: 清理 Actions 历史记录
        run: |
          repo="${{ github.repository }}"
          KEEP_RUNS="${{ github.event.inputs.keep_runs || 5 }}"
          
          echo "🔍 正在获取仓库 [$repo] 的历史运行记录..."
          
          # 获取除当前正在排队和运行之外的所有记录（ID 和 状态）
          # 按创建时间倒序，跳过前 KEEP_RUNS 个，把剩下的全删了
          runs=$(gh run list -R "$repo" --limit 200 --json databaseId,status,createdAt -q 'sort_by(.createdAt) | reverse | .[] | select(.status != "in_progress" and .status != "queued") | .databaseId')
          
          if [ -z "$runs" ]; then
            echo "✅ 没有发现可清理的历史记录！"
            exit 0
          fi

          count=0
          skip=0
          for run_id in $runs; do
            if [ "$skip" -lt "$KEEP_RUNS" ]; then
              skip=$((skip + 1))
              echo "🛡️ 保留最近的记录 ID: $run_id"
              continue
            fi
            
            echo "🗑️ 正在删除记录 ID: $run_id ..."
            gh run delete -R "$repo" "$run_id"
            count=$((count + 1))
          done
          
          echo "✨ 清理完成！共删除 $count 条历史记录。"

      - name: 可选清理 Releases
        if: ${{ github.event.inputs.delete_releases == 'true' || github.event_name == 'schedule' }}
        run: |
          repo="${{ github.repository }}"
          KEEP_RELEASES=2 # 设定你想保留的最新 Release 数量
          
          echo "🔍 正在检查 Releases 记录..."
          
          # 获取所有 Tags 名称，跳过前 KEEP_RELEASES 个
          releases=$(gh release list -R "$repo" --limit 50 --json tagName,createdAt -q 'sort_by(.createdAt) | reverse | .[] | .tagName')
          
          if [ -z "$releases" ]; then
            echo "✅ 没有发现 Releases！"
            exit 0
          fi

          count=0
          skip=0
          for tag in $releases; do
            if [ "$skip" -lt "$KEEP_RELEASES" ]; then
              skip=$((skip + 1))
              echo "🛡️ 保留最新的 Release: $tag"
              continue
            fi
            
            echo "🗑️ 正在删除旧 Release: $tag ..."
            # 删除 Release 及其附带的固件文件
            gh release delete -R "$repo" "$tag" --yes
            count=$((count + 1))
          done
          
          echo "✨ Release 清理完成！共删除 $count 个旧版本。"
        env:
          GH_TOKEN: ${{ github.token }}